<!-- Template: Stock Table Component -->
<!-- Rubrik 1.1: Vue Component & Template -->
<!-- Rubrik 1.2: v-for, v-bind, v-model, v-text, v-html, Vue Filter -->
<!-- Rubrik 1.3: v-if/v-else/v-show -->
<!-- Rubrik 1.4: computed filteredSortedStok, methods CRUD -->
<!-- Rubrik 1.5: watcher filterUpbjj -->
<!-- Rubrik 1.6: event keyboard Enter, mouse hover tooltip, delete confirm -->
<script type="text/x-template" id="tpl-stock-table">
  <div>
    <!-- Filter Bar -->
    <div class="card card-body mb-1" style="margin-bottom:1.25rem;">
      <div class="filter-bar">

        <!-- Filter UT-Daerah -->
        <div class="filter-group">
          <label>UT-Daerah</label>
          <select v-model="filterUpbjj">
            <option value="">Semua Daerah</option>
            <option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option>
          </select>
        </div>

        <!-- Filter Kategori (dependent options: muncul hanya jika UT-Daerah dipilih) -->
        <!-- Rubrik 1.5: watcher filterUpbjj reset kategori -->
        <div class="filter-group" v-show="filterUpbjj">
          <label>Kategori MK</label>
          <select v-model="filterKategori">
            <option value="">Semua Kategori</option>
            <option v-for="k in kategoriList" :key="k" :value="k">{{ k }}</option>
          </select>
        </div>

        <!-- Filter Sort -->
        <div class="filter-group">
          <label>Urutkan</label>
          <select v-model="sortBy">
            <option value="">-- Tanpa Sort --</option>
            <option value="judul">Judul</option>
            <option value="qty">Stok (Qty)</option>
            <option value="harga">Harga</option>
          </select>
        </div>

        <!-- Filter Reorder (qty < safety atau qty = 0) -->
        <div class="filter-group checkbox-group">
          <input type="checkbox" id="chkReorder" v-model="filterReorder">
          <label for="chkReorder">⚠️ Perlu Re-order</label>
        </div>

        <!-- Tombol Reset Filter -->
        <div class="filter-group" style="padding-top:1.4rem;">
          <button class="btn btn-secondary" @click="resetFilter">↺ Reset</button>
        </div>

        <!-- Tombol Tambah -->
        <div class="filter-group" style="padding-top:1.4rem; margin-left:auto;">
          <button class="btn btn-primary" @click="openTambah">+ Tambah Bahan Ajar</button>
        </div>
      </div>
    </div>

    <!-- Tabel Stok -->
    <div class="card">
      <div class="card-header">
        <span>Daftar Stok Bahan Ajar</span>
        <span class="text-muted text-sm">Total: {{ filteredSortedStok.length }} item</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Kode MK</th>
              <th>Judul Mata Kuliah</th>
              <th>Kategori</th>
              <th>UT-Daerah</th>
              <th>Lokasi Rak</th>
              <!-- Rubrik 1.2: Filter formatRupiah -->
              <th>Harga</th>
              <!-- Rubrik 1.2: Filter formatBuah -->
              <th>Stok (Qty)</th>
              <th>Safety Stock</th>
              <!-- Rubrik 1.3: Status + Tooltip hover catatanHTML -->
              <th>Status & Catatan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rubrik 1.2: v-for list rendering, zero-based index -->
            <tr v-for="(item, index) in filteredSortedStok" :key="item.kode">
              <td class="text-muted text-sm">{{ index + 1 }}</td>
              <!-- Rubrik 1.2: v-text directive -->
              <td class="text-mono fw-bold" style="color:#1e3a8a;" v-text="item.kode"></td>
              <td>{{ item.judul }}</td>
              <td>
                <span class="badge badge-proses" style="font-size:0.72rem;">{{ item.kategori }}</span>
              </td>
              <td>{{ item.upbjj }}</td>
              <td class="text-mono text-sm">{{ item.lokasiRak }}</td>
              <!-- Rubrik 1.2: Vue Filter formatRupiah -->
              <td class="text-mono fw-bold" style="color:#059669;">{{ item.harga | formatRupiah }}</td>

              <!-- Rubrik 1.6: Inline edit qty — trigger Enter untuk update -->
              <td>
                <div v-if="editingId === item.kode" class="inline-edit">
                  <input
                    type="number"
                    v-model.number="editQty"
                    min="0"
                    @keyup.enter="saveInlineEdit(item)"
                    @keyup.esc="cancelInlineEdit"
                    :ref="'editQty_' + item.kode"
                    title="Tekan Enter untuk simpan, Esc untuk batal"
                  >
                </div>
                <!-- Rubrik 1.2: Vue Filter formatBuah -->
                <span v-else @dblclick="startInlineEdit(item, 'qty')" :title="'Qty: ' + item.qty + ' — Klik 2x untuk edit'" style="cursor:pointer;">
                  {{ item.qty | formatBuah }}
                </span>
              </td>

              <!-- Rubrik 1.6: Inline edit safety — trigger Enter untuk update -->
              <td>
                <div v-if="editingId === item.kode" class="inline-edit">
                  <input
                    type="number"
                    v-model.number="editSafety"
                    min="0"
                    @keyup.enter="saveInlineEdit(item)"
                    @keyup.esc="cancelInlineEdit"
                    title="Tekan Enter untuk simpan, Esc untuk batal"
                  >
                </div>
                <!-- Rubrik 1.2: Vue Filter formatBuah -->
                <span v-else @dblclick="startInlineEdit(item, 'safety')" :title="'Safety: ' + item.safety + ' — Klik 2x untuk edit'" style="cursor:pointer;">
                  {{ item.safety | formatBuah }}
                </span>
              </td>

              <!-- Rubrik 1.3: Conditional status + Rubrik 1.6: Tooltip hover mouse event -->
              <td>
                <status-badge :qty="item.qty" :safety="item.safety" :catatan="item.catatanHTML"></status-badge>
              </td>

              <td>
                <div class="flex gap-2 align-center">
                  <button class="btn btn-warning btn-xs" @click="openEdit(item)" title="Edit data lengkap">✏️ Edit</button>
                  <button class="btn btn-danger btn-xs" @click="konfirmasiHapus(item)" title="Hapus bahan ajar">🗑️ Hapus</button>
                </div>
              </td>
            </tr>

            <!-- Empty state v-if -->
            <tr v-if="filteredSortedStok.length === 0">
              <td colspan="11">
                <div class="empty-state">
                  <div class="icon">📭</div>
                  <p>Tidak ada data bahan ajar yang sesuai filter.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal Tambah / Edit Bahan Ajar -->
    <!-- Rubrik 1.3: v-if modal show/hide -->
    <!-- Rubrik 1.6: form input + validasi + keyboard Enter -->
    <div class="modal-overlay" v-if="showModal" @click.self="closeModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>{{ isEditing ? '✏️ Edit Bahan Ajar' : '+ Tambah Bahan Ajar Baru' }}</h3>
          <button class="modal-close" @click="closeModal">&times;</button>
        </div>
        <div class="modal-body">
          <!-- Rubrik 1.6: Validasi sederhana - tampil pesan error -->
          <div class="alert alert-error" v-if="formError">⚠️ {{ formError }}</div>
          <div class="form-grid" @keyup.enter="submitForm">
            <div class="form-group">
              <label>Kode MK <span style="color:red">*</span></label>
              <input
                type="text"
                v-model="form.kode"
                placeholder="Contoh: EKMA4116"
                :class="{ invalid: errors.kode }"
                :disabled="isEditing"
              >
              <span class="form-error" v-if="errors.kode">{{ errors.kode }}</span>
            </div>
            <div class="form-group">
              <label>Judul Mata Kuliah <span style="color:red">*</span></label>
              <input type="text" v-model="form.judul" placeholder="Judul MK" :class="{ invalid: errors.judul }">
              <span class="form-error" v-if="errors.judul">{{ errors.judul }}</span>
            </div>
            <div class="form-group">
              <label>Kategori <span style="color:red">*</span></label>
              <select v-model="form.kategori" :class="{ invalid: errors.kategori }">
                <option value="">-- Pilih Kategori --</option>
                <option v-for="k in kategoriList" :key="k" :value="k">{{ k }}</option>
              </select>
              <span class="form-error" v-if="errors.kategori">{{ errors.kategori }}</span>
            </div>
            <div class="form-group">
              <label>UT-Daerah (UPBJJ) <span style="color:red">*</span></label>
              <select v-model="form.upbjj" :class="{ invalid: errors.upbjj }">
                <option value="">-- Pilih UPBJJ --</option>
                <option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option>
              </select>
              <span class="form-error" v-if="errors.upbjj">{{ errors.upbjj }}</span>
            </div>
            <div class="form-group">
              <label>Lokasi Rak <span style="color:red">*</span></label>
              <input type="text" v-model="form.lokasiRak" placeholder="Contoh: R1-A3" :class="{ invalid: errors.lokasiRak }">
              <span class="form-error" v-if="errors.lokasiRak">{{ errors.lokasiRak }}</span>
            </div>
            <div class="form-group">
              <label>Harga (Rp) <span style="color:red">*</span></label>
              <input type="number" v-model.number="form.harga" placeholder="65000" min="0" :class="{ invalid: errors.harga }">
              <span class="form-error" v-if="errors.harga">{{ errors.harga }}</span>
            </div>
            <div class="form-group">
              <label>Jumlah Stok (Qty) <span style="color:red">*</span></label>
              <input type="number" v-model.number="form.qty" placeholder="30" min="0" :class="{ invalid: errors.qty }">
              <span class="form-error" v-if="errors.qty">{{ errors.qty }}</span>
            </div>
            <div class="form-group">
              <label>Safety Stock <span style="color:red">*</span></label>
              <input type="number" v-model.number="form.safety" placeholder="10" min="0" :class="{ invalid: errors.safety }">
              <span class="form-error" v-if="errors.safety">{{ errors.safety }}</span>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
              <label>Catatan (HTML diperbolehkan)</label>
              <input type="text" v-model="form.catatanHTML" placeholder="Contoh: <em>Edisi 2024</em>">
              <span class="form-hint">Contoh: &lt;em&gt;Edisi 2024&lt;/em&gt; atau &lt;strong&gt;Prioritas&lt;/strong&gt;</span>
            </div>
          </div>
          <p class="text-xs text-muted mt-1">💡 Tekan <strong>Enter</strong> di dalam form untuk menyimpan langsung.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" @click="closeModal">Batal</button>
          <button class="btn btn-primary" @click="submitForm">{{ isEditing ? 'Simpan Perubahan' : 'Tambahkan' }}</button>
        </div>
      </div>
    </div>

    <!-- Confirm Delete Dialog -->
    <!-- Rubrik 1.3: v-if + Rubrik 1.6: popup konfirmasi hapus -->
    <div class="confirm-overlay" v-if="showConfirmDelete" @click.self="showConfirmDelete = false">
      <div class="confirm-box">
        <div class="icon-warn">🗑️</div>
        <h4>Yakin Menghapus Data?</h4>
        <p>Bahan ajar <strong>{{ deleteTarget ? deleteTarget.judul : '' }}</strong> ({{ deleteTarget ? deleteTarget.kode : '' }}) akan dihapus secara permanen.</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" @click="showConfirmDelete = false">Batal</button>
          <button class="btn btn-danger" @click="hapusData">Ya, Hapus</button>
        </div>
      </div>
    </div>

    <!-- Success Alert -->
    <div
      class="alert alert-success"
      v-show="successMsg"
      style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;min-width:260px;"
    >
      ✅ {{ successMsg }}
    </div>
  </div>
</script>
