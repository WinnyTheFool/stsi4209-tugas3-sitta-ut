<!-- Template: App Modal Wrapper -->
<!-- Rubrik 1.3: v-if untuk tampil/sembunyikan modal -->
<!-- Rubrik 1.8: Vue Component <app-modal> -->
<script type="text/x-template" id="tpl-app-modal">
  <div class="modal-overlay" v-if="show" @click.self="$emit('close')">
    <div class="modal-box">
      <div class="modal-header">
        <h3>{{ title }}</h3>
        <button class="modal-close" @click="$emit('close')" title="Tutup">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Slot: konten modal dari parent component -->
        <slot></slot>
      </div>
      <div class="modal-footer" v-if="showFooter">
        <button class="btn btn-secondary" @click="$emit('close')">Batal</button>
        <button class="btn btn-primary" @click="$emit('confirm')">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
</script>
